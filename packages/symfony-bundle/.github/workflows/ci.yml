name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}${{ matrix.deps == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', symfony: '6.4.*' }
          - { php: '8.2', symfony: '6.4.*' }
          - { php: '8.3', symfony: '6.4.*' }
          - { php: '8.4', symfony: '6.4.*' }
          - { php: '8.5', symfony: '6.4.*' }
          - { php: '8.2', symfony: '7.4.*' }
          - { php: '8.3', symfony: '7.4.*' }
          - { php: '8.4', symfony: '7.4.*' }
          - { php: '8.5', symfony: '7.4.*' }
          - { php: '8.4', symfony: '8.0.*' }
          - { php: '8.5', symfony: '8.0.*' }
          - { php: '8.4', symfony: '8.1.*' }
          - { php: '8.5', symfony: '8.1.*' }
          - { php: '8.1', symfony: '6.4.*', deps: 'lowest' }
          - { php: '8.2', symfony: '7.4.*', deps: 'lowest' }
          - { php: '8.4', symfony: '8.0.*', deps: 'lowest' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: pie, composer:v2
          coverage: none
        env:
          fail-fast: true

      - name: Install biscuit-php extension (prebuilt only)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::pie install attempt $attempt"
            output=$(sudo pie install ptondereau/biscuit-php:0.5.1 --no-interaction --no-cache 2>&1 || true)
            echo "$output"
            echo "::endgroup::"
            if echo "$output" | grep -q "Pre-packaged binary found"; then
              echo "✓ Installed prebuilt biscuit_php on attempt $attempt"
              exit 0
            fi
            echo "::warning::pie did not pick the prebuilt binary on attempt $attempt; retrying..."
            sleep 5
          done
          echo "::error::pie failed to install prebuilt biscuit_php after 3 attempts"
          exit 1

      - name: Constrain Symfony version
        run: |
          composer require --no-update --no-interaction \
            "symfony/framework-bundle:${{ matrix.symfony }}" \
            "symfony/security-bundle:${{ matrix.symfony }}" \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/console:${{ matrix.symfony }}"
          composer require --no-update --no-interaction --dev \
            "symfony/cache:${{ matrix.symfony }}" \
            "symfony/web-profiler-bundle:${{ matrix.symfony }}" \
            "symfony/twig-bundle:${{ matrix.symfony }}" \
            "symfony/twig-bridge:${{ matrix.symfony }}" \
            "symfony/property-access:${{ matrix.symfony }}" \
            "symfony/property-info:${{ matrix.symfony }}" \
            "symfony/browser-kit:${{ matrix.symfony }}" \
            "symfony/css-selector:${{ matrix.symfony }}" \
            "symfony/messenger:${{ matrix.symfony }}" \
            "symfony/runtime:${{ matrix.symfony }}" \
            "symfony/yaml:${{ matrix.symfony }}"

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          dependency-versions: ${{ matrix.deps == 'lowest' && 'lowest' || 'highest' }}

      - name: Run quality gate
        run: composer check

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: pie, composer:v2
          coverage: pcov
        env:
          fail-fast: true

      - name: Install biscuit-php extension (prebuilt only)
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::pie install attempt $attempt"
            output=$(sudo pie install ptondereau/biscuit-php:0.5.1 --no-interaction --no-cache 2>&1 || true)
            echo "$output"
            echo "::endgroup::"
            if echo "$output" | grep -q "Pre-packaged binary found"; then
              echo "✓ Installed prebuilt biscuit_php on attempt $attempt"
              exit 0
            fi
            echo "::warning::pie did not pick the prebuilt binary on attempt $attempt; retrying..."
            sleep 5
          done
          echo "::error::pie failed to install prebuilt biscuit_php after 3 attempts"
          exit 1

      - name: Constrain Symfony version
        run: |
          composer require --no-update --no-interaction \
            "symfony/framework-bundle:7.4.*" \
            "symfony/security-bundle:7.4.*" \
            "symfony/config:7.4.*" \
            "symfony/dependency-injection:7.4.*" \
            "symfony/console:7.4.*"
          composer require --no-update --no-interaction --dev \
            "symfony/cache:7.4.*" \
            "symfony/web-profiler-bundle:7.4.*" \
            "symfony/twig-bundle:7.4.*" \
            "symfony/twig-bridge:7.4.*" \
            "symfony/property-access:7.4.*" \
            "symfony/property-info:7.4.*" \
            "symfony/browser-kit:7.4.*" \
            "symfony/css-selector:7.4.*" \
            "symfony/messenger:7.4.*" \
            "symfony/runtime:7.4.*" \
            "symfony/yaml:7.4.*"

      - name: Install dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.xml
          format: clover
          github-token: ${{ secrets.GITHUB_TOKEN }}

  consumer-install:
    name: Consumer install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - name: Install the way a consumer would
        run: composer install --no-dev --no-progress --ignore-platform-req=ext-biscuit_php

      - name: Every interface a shipped class typehints must be installed
        run: |
          set -euo pipefail
          for package in psr/cache psr/log symfony/event-dispatcher-contracts; do
            if ! composer show "$package" >/dev/null 2>&1; then
              echo "::error::$package is used by a shipped class but missing from a --no-dev install"
              exit 1
            fi
            echo "✓ $package"
          done

      - name: No suggested package may be needed to load the bundle
        run: |
          set -euo pipefail
          for package in doctrine/dbal doctrine/orm symfony/maker-bundle symfony/messenger symfony/web-profiler-bundle symfony/yaml; do
            if composer show "$package" >/dev/null 2>&1; then
              echo "::error::$package leaked into a --no-dev install; it should stay a suggestion"
              exit 1
            fi
          done
          php -r '
            require "vendor/autoload.php";
            $classes = [
              "Biscuit\\BiscuitBundle\\BiscuitBundle",
              "Biscuit\\BiscuitBundle\\DependencyInjection\\BiscuitExtension",
              "Biscuit\\BiscuitBundle\\Revocation\\RevocationChecker",
              "Biscuit\\BiscuitBundle\\Revocation\\Store\\CacheRevocationStore",
              "Biscuit\\BiscuitBundle\\Revocation\\Message\\RevokeToken",
              "Biscuit\\BiscuitBundle\\Revocation\\Message\\UnrevokeToken",
              "Biscuit\\BiscuitBundle\\Revocation\\Message\\PurgeExpiredRevocations",
              "Biscuit\\BiscuitBundle\\Revocation\\Message\\RevocationPushHandler",
              "Biscuit\\BiscuitBundle\\Security\\Http\\AuthenticationFailureResponseFactory",
            ];
            foreach ($classes as $class) {
              if (!class_exists($class)) {
                fwrite(STDERR, "missing: $class\n");
                exit(1);
              }
              foreach ((new ReflectionClass($class))->getConstructor()?->getParameters() ?? [] as $parameter) {
                $type = $parameter->getType();
                if ($type instanceof ReflectionNamedType && !$type->isBuiltin() && !class_exists($type->getName()) && !interface_exists($type->getName())) {
                  fwrite(STDERR, sprintf("%s typehints missing %s\n", $class, $type->getName()));
                  exit(1);
                }
              }
              echo "ok: $class\n";
            }
          '
