[package]
name = "biscuit_php"
version = "0.8.1"
edition = "2024"
license = "Apache-2.0"
description = "PHP wrapper for Biscuit authorization tokens"
authors = ["Pierre Tondereau <pierre.tondereau@protonmail.com>"]

[dependencies]
ext-php-rs = "0.16.4"
biscuit-auth = { version = "7.0.0-alpha.1", features = ["pem"] }
biscuit-parser = "0.3.0-alpha.1"
hex = "0.4"
thiserror = "2"

[lib]
name = "biscuit_php"
crate-type = ["cdylib"]

[profile.release]
strip = "debuginfo"
