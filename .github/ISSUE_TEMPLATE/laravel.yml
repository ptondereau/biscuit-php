name: Laravel
description: The biscuit Laravel package
labels: ["laravel"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened or what do you need? Add a reproducer if it is a bug.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: package 0.5.3, ext-biscuit 0.5.3, Laravel 12, PHP 8.4
    validations:
      required: true
