name: Symfony bundle
description: The biscuit Symfony bundle
labels: ["symfony-bundle"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened or what do you need? Add a reproducer if it is a bug.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: bundle 0.5.3, ext-biscuit 0.5.3, Symfony 7.3, PHP 8.4
    validations:
      required: true
