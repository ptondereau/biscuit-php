name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    name: Build extension and run tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: "Install PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "none"
          ini-values: "memory_limit=-1"
          extensions: mbstring
          tools: composer:v2.9.7

      - name: Build
        run: cargo build --release --all-features

      - name: Run linter (clippy)
        run: cargo clippy -- -D warnings

      - name: "Install dependencies (Composer)"
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3

      - name: Validate stubs
        run: |
          find stubs -name '*.php' -print0 | xargs -0 -n1 php -l
          composer validate --strict dist/stubs-package/composer.json

      - name: Setup Mago
        if: ${{ matrix.php-version == '8.5' }}
        uses: nhedger/setup-mago@db907a61008831176aa6d71499a8479868edb141 # v1
        with:
          version: 1.47.2

      - name: Run Mago
        if: ${{ matrix.php-version == '8.5' }}
        run: |
          mago format --dry-run
          mago lint --reporting-format=github

      - name: "Run PHPUnit"
        run: php -dextension=./target/release/libbiscuit_php.so vendor/bin/phpunit

  tests-debug:
    runs-on: ubuntu-latest
    continue-on-error: true

    name: Build extension and run tests (PHP debug)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-debug-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-debug-

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: "Install PHP (debug build)"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          coverage: "none"
          ini-values: "memory_limit=-1"
          extensions: mbstring
          tools: composer:v2.9.7
        env:
          debug: true

      - name: Build
        run: cargo build --release --all-features

      - name: "Install dependencies (Composer)"
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3

      - name: "Run PHPUnit"
        run: php -dextension=./target/release/libbiscuit_php.so vendor/bin/phpunit
