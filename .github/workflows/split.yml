name: Split packages

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SPLITSH_VERSION: v1.0.1
  SPLITSH_SHA256: 2539301ce5e21d0ca44b689d0dd2c1b20d9f9e996c1fe6c462afb8af4e7141cc

jobs:
  split:
    name: Split ${{ matrix.package.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: split-${{ matrix.package.repository }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        package:
          - { prefixes: "--prefix=packages/stubs: --prefix=stubs:stubs", repository: ptondereau/biscuit-php-stubs }
          - { prefixes: "--prefix=packages/symfony-bundle:", repository: ptondereau/biscuit-sf-bundle }
          - { prefixes: "--prefix=packages/laravel:", repository: ptondereau/biscuit-laravel }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install splitsh-lite
        run: |
          curl -fsSL -o "$RUNNER_TEMP/splitsh.tar.gz" \
            "https://github.com/splitsh/lite/releases/download/$SPLITSH_VERSION/lite_linux_amd64.tar.gz"
          echo "$SPLITSH_SHA256  $RUNNER_TEMP/splitsh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/splitsh.tar.gz" -C "$RUNNER_TEMP"

      - name: Split and push
        env:
          PREFIXES: ${{ matrix.package.prefixes }}
          REPOSITORY: ${{ matrix.package.repository }}
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          sha=$("$RUNNER_TEMP/splitsh-lite" $PREFIXES)
          remote="https://x-access-token:${SPLIT_TOKEN}@github.com/${REPOSITORY}.git"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git push "$remote" "${sha}:refs/tags/${GITHUB_REF_NAME}"
          else
            git push "$remote" "${sha}:refs/heads/main"
          fi
